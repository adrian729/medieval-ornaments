<!doctype html><html lang="en"><head>
<link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="../favicon-32.png" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="../favicon.svg" sizes="any">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All frame previews</title>
<link rel="stylesheet" href="../ornaments.css">
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#efe7d3;font:12px system-ui}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.card{min-width:0;padding:8px;background:#faf7ef}.frame{--ornament-size:24px;width:100%;height:160px;display:grid;place-items:center;margin:8px 0}.small{width:150px;height:110px;--ornament-size:16px}.dark{background:#29333c;color:#eee}p{margin:4px;overflow-wrap:anywhere}</style>
</head>
<h1>Repeating border designs · large and small frames</h1><div class="grid" id="grid"></div>
<script type="module">
import { assetUrl } from './assets.js';
import { ornaments, createFrame } from '../lib/index.js';
const repeats=ornaments.filter(x=>x.kind==='repeat-tile'),controllers=[];
document.querySelector('h1').textContent=repeats.length+' repeating border designs · large and small frames';
const label=document.createElement('label');label.textContent='Format ';
const select=document.createElement('select');select.id='format';
for(const [value,text] of [['auto','Automatic (SVG florals, painted WebP)'],['svg','SVG / color trace'],['webp','WebP'],['png','PNG']])select.append(new Option(text,value));
label.append(select);document.getElementById('grid').before(label);
for(const item of repeats){
  const card=document.createElement('section');card.className='card';
  const title=document.createElement('p');title.textContent=item.name;card.append(title);
  for(const size of ['large','small']){
    const frame=document.createElement('div');frame.className='frame '+(size==='small'?'small dark':'');
    frame.textContent=size==='small'?'150 × 110':'Responsive frame';card.append(frame);
    controllers.push(createFrame(frame,{design:item.name,size:size==='small'?16:24,assetsBase:new URLSearchParams(location.search).get('assets')==='local'?new URL('../',location.href).href:document.documentElement.dataset.assetsBase?new URL(document.documentElement.dataset.assetsBase,location.href).href:undefined,pixelRatio:devicePixelRatio||1,loading:'lazy'}));
  }
  document.getElementById('grid').append(card);
}
select.addEventListener('input',()=>{for(const controller of controllers)controller.update({format:select.value})});
document.body.dataset.ready='true';
</script></html>
