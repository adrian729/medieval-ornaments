<!doctype html><html lang="en"><head>
<link rel="icon" type="image/x-icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="../favicon-32.png" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="../favicon.svg" sizes="any">
<meta charset="utf-8"><title>All frame previews</title>
<link rel="stylesheet" href="../ornaments.css">
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#efe7d3;font:12px system-ui}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{min-width:0;padding:8px;background:#faf7ef}.frame{--ornament-size:24px;width:100%;height:160px;display:grid;place-items:center;margin:8px 0}.small{width:150px;height:110px;--ornament-size:16px}.dark{background:#29333c;color:#eee}p{margin:4px;overflow-wrap:anywhere}</style>
</head>
<h1>40 repeating border designs · large and small frames</h1><div class="grid" id="grid"></div>
<script>fetch('../images.json').then(r=>r.json()).then(items=>{for(const item of items.filter(x=>x.kind==='repeat-tile')){const card=document.createElement('section');card.className='card';const title=document.createElement('p');title.textContent=item.name;card.append(title);for(const size of ['large','small']){const frame=document.createElement('div');frame.className='frame ornament-frame '+(size==='small'?'small dark':'');frame.style.setProperty('--ornament-image',`url('${new URL('../'+item.components.border_image.svg,location.href).href}')`);frame.style.setProperty('--ornament-slice',item.border_image_slice_percent+'%');frame.textContent=size==='small'?'150 × 110':'Responsive frame';card.append(frame)}document.getElementById('grid').append(card)}document.body.dataset.ready='true'});</script></html>
