<!doctype html><html lang="en"><meta charset="utf-8"><title>All frame previews</title>
<style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#efe7d3;font:12px system-ui}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{min-width:0;padding:8px;background:#faf7ef}.frame{border:24px solid transparent;width:100%;height:160px;display:grid;place-items:center;margin:8px 0}.small{width:150px;height:110px;border-width:16px}.dark{background:#29333c;color:#eee}p{margin:4px;overflow-wrap:anywhere}</style>
<h1>44 adapted border designs · large and small frames</h1><div class="grid" id="grid"></div>
<script>fetch('../images.json').then(r=>r.json()).then(items=>{for(const item of items.filter(x=>x.kind==='repeat-tile')){const card=document.createElement('section');card.className='card';const title=document.createElement('p');title.textContent=item.name;card.append(title);for(const size of ['large','small']){const frame=document.createElement('div');frame.className='frame '+(size==='small'?'small dark':'');frame.style.borderImage=`url('../${item.components.border_image.svg}') ${item.border_image_slice_percent}% / 1 / 0 round`;frame.textContent=size==='small'?'150 × 110':'Responsive frame';card.append(frame)}document.getElementById('grid').append(card)}document.body.dataset.ready='true'});</script></html>
