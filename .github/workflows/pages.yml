name: Deploy examples
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:types
      - run: npm run build:browser
      - name: Assemble public site
        run: |
          mkdir -p dist/site
          cp -R examples lib svg png webp docs sources dist/site/
          cp index.html ornaments.css favicon.svg favicon-32.png favicon.ico images.json LICENSE *.md source-patterns.json additional-patterns.json reference-crops.json raster-metadata.json EXTRACTION-PROMPTS.json dist/site/
          cp -R dist/react/. dist/site/examples/react/
          cp dist/medieval-ornaments-browser.zip dist/site/
          touch dist/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
